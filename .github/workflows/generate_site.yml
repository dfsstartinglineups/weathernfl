name: NFL Static Site Generator

on:
  workflow_dispatch: # Enables manual triggering from the GitHub Actions UI
  repository_dispatch: 
    types: [update-nfl-weather] # Enables external webhook triggering from cron-job.org

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin
          
      - name: Run NFL Site Generator
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/generate_site.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html team_pages/ sitemap.xml
          # [skip ci] prevents this automated commit from accidentally triggering other workflows
          git commit -m "Automated NFL site build [skip ci]" || echo "No changes to commit"
          git push
